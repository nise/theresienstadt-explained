name: Deploy to GitHub Pages

on:
  push:
    branches:
    - master

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build
      run: npm run build
      env:
        VUE_APP_VIDEO_URL: https://nise81.com/theresienstadt.mp4
        VUE_APP_INTRO_VIDEO_URL: https://nise81.com/intro.mp4
        VUE_APP_MAPBOX_TOKEN: ${{ secrets.MAPBOX_TOKEN }}

    - uses: actions/upload-pages-artifact@v3
      with:
        path: dist/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - uses: actions/deploy-pages@v4
      id: deployment
